name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
          key: ${{ runner.os }}-brew-ci-v1
          restore-keys: |
            ${{ runner.os }}-brew-ci-

      - name: Install runtime dependencies
        run: |
          which scrcpy || brew install scrcpy
          which adb || brew install android-platform-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & Test Android Shadow Daemon (if Android SDK available)
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/platforms" ]; then
            chmod +x android-daemon/gradlew android-daemon/scripts/*.sh
            ./android-daemon/scripts/build-dex.sh
          else
            echo "Android SDK not present on runner; skipping android-daemon DEX build."
          fi

      - name: Build Swift Package
        run: swift build -v

      - name: Run Test Suite
        run: swift test -v
