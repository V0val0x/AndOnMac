name: CI & Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
          key: ${{ runner.os }}-brew-v2
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install dependencies
        run: |
          which scrcpy || brew install scrcpy
          which adb || brew install android-platform-tools

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & Test Android Shadow Daemon
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/platforms" ]; then
            chmod +x android-daemon/gradlew android-daemon/scripts/*.sh
            ./android-daemon/scripts/build-dex.sh
          fi

      - name: Run Test Suite
        run: |
          swift test -v

      - name: Build Standalone App & Disk Image (DMG)
        run: |
          chmod +x scripts/*.sh
          ./scripts/create_dmg.sh
          cat dist/checksums.txt

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndOnMac-macOS-Universal
          path: |
            dist/AndOnMac.dmg
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AndOnMac ${{ github.ref_name }}
          files: |
            dist/AndOnMac.dmg
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
